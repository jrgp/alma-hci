name: Build and publish

on:
  schedule:
    - cron: '37 8 * * *'
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE]
  pull_request:
    paths-ignore: ['**/*.md', LICENSE]
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the last published image is current
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REF: ghcr.io/jrgp/alma-hci
  BASE_TAG: quay.io/almalinuxorg/almalinux-bootc:10

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      base_image: ${{ steps.check.outputs.base_image }}
      base_digest: ${{ steps.check.outputs.base_digest }}
      source_hash: ${{ steps.check.outputs.source_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install inspection tools
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry/config.json" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo podman
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.5
      - name: Registry login
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Compare base, source and RPM updates
        id: check
        env:
          FORCE: ${{ inputs.force == true || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: bash ci/check-updates.sh

  build:
    name: Build, boot-test and publish
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      LOCAL_IMAGE: localhost/alma-hci:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and KVM test tools
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry/config.json" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo qemu-system-x86 qemu-utils ovmf python3 python3-virt-firmware
          test -c /dev/kvm
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.5
      - name: Verify the exact upstream base
        env:
          BASE_IMAGE: ${{ needs.check.outputs.base_image }}
        run: cosign verify --key bootc.pub "$BASE_IMAGE" > /dev/null
      - name: Test change detection
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prepare module signing key
        env:
          ZFS_MODULE_SIGNING_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ZFS_MODULE_SIGNING_KEY || '' }}
        run: |
          umask 077
          key="$RUNNER_TEMP/zfs-module.key"
          cert="$GITHUB_WORKSPACE/zfs-signing.der"
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_REF" != refs/heads/main ]]; then
            cert="$RUNNER_TEMP/zfs-test.der"
            openssl req -new -x509 -newkey rsa:4096 -nodes -days 2 \
              -subj '/CN=Alma HCI ZFS module signing/' \
              -addext 'basicConstraints=critical,CA:FALSE' \
              -addext 'keyUsage=critical,digitalSignature' \
              -addext 'extendedKeyUsage=codeSigning,1.3.6.1.4.1.2312.16.1.2' \
              -keyout "$key" -outform DER -out "$cert"
          else
            test -n "$ZFS_MODULE_SIGNING_KEY"
            printf '%s\n' "$ZFS_MODULE_SIGNING_KEY" > "$key"
          fi
          echo "ZFS_SIGNING_KEY=$key" >> "$GITHUB_ENV"
          echo "ZFS_SIGNING_CERT=$cert" >> "$GITHUB_ENV"
      - name: Build image
        env:
          BASE_IMAGE: ${{ needs.check.outputs.base_image }}
          BASE_DIGEST: ${{ needs.check.outputs.base_digest }}
          SOURCE_HASH: ${{ needs.check.outputs.source_hash }}
        run: |
          mkdir -p output
          make image IMAGE_NAME="$LOCAL_IMAGE" \
            BUILD_VERSION="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            REVISION="$GITHUB_SHA"
      - name: Check image and boot twice with ZFS and nested KVM
        run: |
          make test IMAGE_NAME="$LOCAL_IMAGE"
          sudo podman run --rm "$LOCAL_IMAGE" cat /usr/share/alma-server/packages.txt > output/packages.txt
          sudo podman run --rm "$LOCAL_IMAGE" cat /usr/share/alma-server/kmod-build.txt > output/kmod-build.txt
      - name: Registry login
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Publish candidate, test signature enforcement, then promote
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publish.sh
      - name: Make non-secret evidence readable for upload
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/zfs-module.key"
          if sudo test -d output; then
            sudo chown "$USER:$USER" output
            sudo chmod 755 output
            if sudo test -d output/vm; then
              sudo chmod 755 output/vm
              sudo find output/vm -maxdepth 1 -type f \( -name '*.log' -o -name 'result.json' \) \
                -exec chmod 644 {} +
            fi
          fi
      - name: Upload test and publishing evidence (never keys or VM disks)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/vm/*.log
            output/vm/result.json
            output/packages.txt
            output/kmod-build.txt
            output/published.json
            output/signature.json
            output/unsigned-rejection.log
            output/signed-acceptance.log
            output/packages.json
            output/release-notes.md
            output/previous-image-inspect.log
